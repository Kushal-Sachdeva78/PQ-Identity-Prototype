name: Reproduction problem or bug
description: Something does not build, run or reproduce as documented
title: "[repro] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is an archival research artifact. Documentation fixes and
        portability fixes are welcome. Changes to the circuit, the contracts or the
        cryptographic operations are out of scope (see CONTRIBUTING.md). If you
        think you found a soundness bug, say so here so it can be discussed and
        recorded before anything changes.
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: make demo
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the relevant output (use a code block) or attach the matching results/*.json file.
    validations:
      required: true
  - type: textarea
    id: host
    attributes:
      label: Host
      description: CPU, OS (and WSL2 version if used), Node, Python and Docker versions.
      placeholder: |
        CPU:
        OS:
        Node:
        Python:
    validations:
      required: true
